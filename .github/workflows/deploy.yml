name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject GPS Photos token
        env:
          GPS_TOKEN: ${{ secrets.MY_KEY_GPS_PHOTOS }}
        run: |
          if [ -z "$GPS_TOKEN" ]; then
            echo "Error: MY_KEY_GPS_PHOTOS secret is empty."
            exit 1
          fi
          python3 -c '
          import os, pathlib, sys
          token = os.environ["GPS_TOKEN"]
          replaced = False
          for path in pathlib.Path(".").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              if "__MY_KEY_GPS_PHOTOS__" in text:
                  path.write_text(text.replace("__MY_KEY_GPS_PHOTOS__", token), encoding="utf-8")
                  print(f"Injected token into {path}")
                  replaced = True
          if not replaced:
              print("Error: __MY_KEY_GPS_PHOTOS__ placeholder was not found.")
              sys.exit(1)
          '

          
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4