name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject GPS Photos token
        env:
          GPS_TOKEN: ${{ secrets.MY_KEY_GPS_PHOTOS }}
        run: |
          test -n "$GPS_TOKEN" || (echo "Error: MY_KEY_GPS_PHOTOS secret is empty." && exit 1)
          grep -q "__MY_KEY_GPS_PHOTOS__" gps-photos.html || (echo "Error: placeholder missing in gps-photos.html" && exit 1)
          python3 -c 'import os, pathlib; p = pathlib.Path("gps-photos.html"); p.write_text(p.read_text().replace("__MY_KEY_GPS_PHOTOS__", os.environ["GPS_TOKEN"]))'

      - name: Inject optional Mappls static map key
        env:
          MAPPLS_KEY: ${{ secrets.MAPPLS_STATIC_KEY }}
        run: |
          if [ -n "$MAPPLS_KEY" ]; then
            grep -q '"__MAPPLS_STATIC_KEY__"' gps-photos.html || (echo "Error: Mappls key placeholder missing in gps-photos.html" && exit 1)
            python3 -c 'import json, os, pathlib; p = pathlib.Path("gps-photos.html"); p.write_text(p.read_text().replace("\"__MAPPLS_STATIC_KEY__\"", json.dumps(os.environ["MAPPLS_KEY"])))'
          else
            echo "MAPPLS_STATIC_KEY is not configured; GPS photo map thumbnails will be unavailable."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4